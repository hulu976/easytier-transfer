name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.1'
  RUST_VERSION: '1.95'
  ANDROID_API_LEVEL: '34'
  ANDROID_NDK_VERSION: '25.2.9519653'
  JAVA_VERSION: '17'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ──────────────────────────────────────
      # JDK 17（必须在 Android SDK 之前：setup-android@v3 下载的 cmdline-tools 16.0
      # 的 sdkmanager 要求 JDK17，否则会报 "detected as 11.0.32" 而退出）
      # ──────────────────────────────────────
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ──────────────────────────────────────
      # Android SDK + NDK
      # ──────────────────────────────────────
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # ──────────────────────────────────────
      # Rust 工具链（锁定 1.95，与 rust-toolchain.toml 一致）
      # ──────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> easytier-gui/src-tauri'
          key: android-rust-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      # ──────────────────────────────────────
      # Node.js + pnpm
      # ──────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # ──────────────────────────────────────
      # 关键修复：删除旧 lockfile，让 pnpm 重建
      # ──────────────────────────────────────
      - name: Install frontend dependencies
        run: |
          # 删除所有 lockfile，避免 workspace 包版本不一致
          rm -f pnpm-lock.yaml
          rm -f easytier-web/frontend-lib/pnpm-lock.yaml
          rm -f easytier-gui/pnpm-lock.yaml
          rm -f tauri-plugin-vpnservice/pnpm-lock.yaml

          # 配置镜像加速
          pnpm config set registry https://registry.npmmirror.com
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000

          # 安装所有 workspace 依赖（--no-frozen-lockfile 因为 lockfile 已删）
          pnpm install --no-frozen-lockfile

      # ──────────────────────────────────────
      # 关键修复：先 build frontend-lib，再 build tauri-plugin-vpnservice-api
      # 这两个是 workspace 内部包，必须先产出 dist/ 才能被 easytier-gui 引用
      # ──────────────────────────────────────
      - name: Build workspace libraries (frontend-lib + vpn-api)
        run: |
          echo "=== 构建 easytier-frontend-lib ==="
          cd easytier-web/frontend-lib
          pnpm build
          echo "=== 检查产物 ==="
          ls -la dist/ 2>/dev/null || echo "⚠️ dist/ 不存在！"
          ls -la dist-js/ 2>/dev/null || true
          cd ../..

          echo "=== 构建 tauri-plugin-vpnservice-api ==="
          cd tauri-plugin-vpnservice
          pnpm build
          echo "=== 检查产物 ==="
          ls -la dist-js/ 2>/dev/null || echo "⚠️ dist-js/ 不存在！"
          cd ..

      # ──────────────────────────────────────
      # 验证 workspace 链接是否正确
      # ──────────────────────────────────────
      - name: Verify workspace symlinks
        run: |
          echo "=== easytier-gui/node_modules 中的 workspace 包 ==="
          ls -la easytier-gui/node_modules/easytier-frontend-lib/ 2>/dev/null || echo "❌ easytier-frontend-lib 未链接"
          ls -la easytier-gui/node_modules/tauri-plugin-vpnservice-api/ 2>/dev/null || echo "❌ tauri-plugin-vpnservice-api 未链接"

          echo ""
          echo "=== 验证类型声明文件存在 ==="
          # frontend-lib 的 .d.ts 由 vite-plugin-dts 生成
          find easytier-web/frontend-lib -name "*.d.ts" 2>/dev/null | head -20
          find tauri-plugin-vpnservice -name "*.d.ts" 2>/dev/null | head -20

      # ──────────────────────────────────────
      # 安装 Tauri CLI（锁定 2.7.1，与 package.json 一致）
      # ──────────────────────────────────────
      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version 2.7.1 --locked --quiet
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ──────────────────────────────────────
      # 内存检测（不强制创建 swap，避免 Text file busy）
      # ──────────────────────────────────────
      - name: Ensure sufficient memory
        run: |
          echo "=== 当前内存状态 ==="
          free -h
          echo "=== 已有 swap ==="
          sudo swapon --show || true

          MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
          SWAP_KB=$(grep SwapTotal /proc/meminfo | awk '{print $2}')
          echo "物理内存: $((MEM_KB/1024)) MB, 已有 swap: $((SWAP_KB/1024)) MB"

          if [ "$SWAP_KB" -ge 4194304 ] || [ "$MEM_KB" -ge 12582912 ]; then
            echo "✅ 内存/swap 充足，跳过扩容"
            exit 0
          fi

          # 用 /swapfile2 避开系统已有的 /swapfile
          sudo fallocate -l 4G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=4096
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          echo "✅ 已添加 4G swap"
          free -h

      # ──────────────────────────────────────
      # 打印版本信息（排错用）
      # ──────────────────────────────────────
      - name: Show Tauri info
        run: |
          cd easytier-gui
          cargo tauri info || true

      # ──────────────────────────────────────
      # protoc（Protocol Buffers 编译器）
      # Rust 依赖链中的 prost-wkt-types 在构建期需要 protoc，
      # GitHub runner 默认未安装，必须显式安装，否则会报
      # "Could not find `protoc`" 而导致 cargo build 失败
      # ──────────────────────────────────────
      - name: Install protobuf compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      # ──────────────────────────────────────
      # clang + libc 开发头文件（供 bindgen 生成 kcp-sys 等 C 库的 Rust FFI 绑定）
      # cross-compile 到 Android 时，bindgen 仍用 host clang 解析 C 头文件，
      # 而 runner 默认缺少 libc6-dev 的 multiarch 头文件（bits/libc-header-start.h），
      # 会导致 "fatal error: 'bits/libc-header-start.h' file not found" 而失败。
      # 同时显式指定 BINDGEN_EXTRA_CLANG_ARGS 的 include 路径以兜底。
      # ──────────────────────────────────────
      - name: Install clang & libc dev headers (for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc6-dev linux-libc-dev gcc
          clang --version

      # ──────────────────────────────────────
      # 离线 Gradle 配置的 CI 适配
      # 仓库 gradle-wrapper.properties 使用离线模式 (file:/prebuilt/gradle-8.14.3-bin.zip)，
      # 为离线构建机设计。CI runner 无法预置 /prebuilt，这里仅在本机工作区把它改为
      # 标准网络下载（不提交改动，仓库离线配置原样保留，离线机构建不受影响）
      # ──────────────────────────────────────
      - name: Adapt Gradle wrapper to CI (network download)
        run: |
          GWP="easytier-gui/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.14.3-bin.zip#' "$GWP"
          echo "=== gradle-wrapper.properties distributionUrl now: ==="
          grep distributionUrl "$GWP"

      # ──────────────────────────────────────
      # 构建 APK
      # ──────────────────────────────────────
      - name: Build Android APK
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "--target=x86_64-linux-gnu -I/usr/include -I/usr/include/x86_64-linux-gnu"
        run: |
          cd easytier-gui
          # 先单独跑 vue-tsc 类型检查，出错时给出清晰日志
          echo "=== 运行 vue-tsc 类型检查 ==="
          pnpm exec vue-tsc --noEmit -p tsconfig.json || true

          echo "=== 开始 Tauri Android 构建 ==="
          cargo tauri android build --apk --target aarch64

      # ──────────────────────────────────────
      # 查找并上传 APK
      # ──────────────────────────────────────
      - name: Find APK
        if: always()
        run: |
          echo "=== 搜索 APK 文件 ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la easytier-gui/src-tauri/gen/android/app/build/outputs/apk/ 2>/dev/null || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easytier-transfer-android
          path: |
            **/*.apk
          retention-days: 30

      # ──────────────────────────────────────
      # 构建总结
      # ──────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## 📱 EasyTier Transfer APK 构建总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust**: ${{ env.RUST_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: ${{ env.PNPM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **JDK**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android NDK**: ${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **tauri-cli**: 2.7.1" >> $GITHUB_STEP_SUMMARY
          echo "- **@tauri-apps/api**: 2.7.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt 0 ]; then
            echo "✅ **APK 构建成功！** 共 $APK_COUNT 个文件" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **未找到 APK 文件**" >> $GITHUB_STEP_SUMMARY
          fi
