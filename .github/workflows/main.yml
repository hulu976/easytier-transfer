name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      NDK_VERSION: "25.2.9519653"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            wget \
            unzip \
            openjdk-17-jdk

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p cmdline-tools/latest
          unzip -q cmdtools.zip -d cmdline-tools/latest
          rm cmdtools.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Android NDK
        run: |
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r25c ndk
          rm ndk.zip
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "easytier-gui/src-tauri"
          cache-on-failure: true

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.5"

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -F easytier-web build

      - name: Verify frontend build output
        run: |
          echo "=== Checking frontend dist ==="
          ls -la easytier-web/frontend-lib/dist/ 2>/dev/null || echo "NO DIST DIR"
          echo ""
          echo "=== Checking for Config.vue compiled output ==="
          grep -l "advanced_settings\|port_forwards\|clipboard_sync" easytier-web/frontend-lib/dist/*.js 2>/dev/null || echo "WARNING: Config keywords not found in dist!"

      - name: Build Android APK (debug)
        if: github.event.inputs.build_type != 'release'
        working-directory: easytier-gui/src-tauri
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_HOME=$ANDROID_NDK_HOME
          pnpm tauri android build --apk --debug

      - name: Build Android APK (release)
        if: github.event.inputs.build_type == 'release'
        working-directory: easytier-gui/src-tauri
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_HOME=$ANDROID_NDK_HOME
          pnpm tauri android build --apk

      - name: Find and list APK files
        run: |
          echo "=== APK files found ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== APK sizes ==="
          find . -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-transfer-android-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            easytier-gui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            easytier-gui/src-tauri/gen/android/apk/**/*.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID**: com.easyshare.easytier" >> $GITHUB_STEP_SUMMARY
          echo "- **EasyTier version**: v2.6.4" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK files:" >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -type f 2>/dev/null | while read f; do
            size=$(ls -lh "$f" | awk '{print $5}')
            echo "- \`$f\` ($size)" >> $GITHUB_STEP_SUMMARY
          done
