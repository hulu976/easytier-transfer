name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  NDK_VERSION: "25.2.9519653"
  RUST_VERSION: "1.95"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─── 安装系统依赖 ───
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libsdl2-dev pkg-config curl wget unzip \
            openjdk-17-jdk-headless

      # ─── 安装 Rust 1.95 ───
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # ─── 设置 Android SDK + NDK ───
      - name: Setup Android SDK + NDK
        run: |
          set -eux
          SDK=/opt/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          rm -rf "$SDK/cmdline-tools/cmdline-tools"
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          which sdkmanager
          sdkmanager --version

      - name: Install SDK packages & NDK
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # ─── Rust 缓存 ───
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            easytier-gui/src-tauri -> easytier-gui/src-tauri/target

      # ─── Node.js + pnpm ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      # ─── 修复 lockfile 并安装前端依赖 ───
      # 关键修复：lockfile 与 frontend-lib/package.json 不同步
      # (@tauri-apps/api 2.7.0 在 package.json 中但 lockfile 缺少解析条目)
      # 使用 --no-frozen-lockfile 让 pnpm 自动更新 lockfile
      - name: Install frontend dependencies (fix lockfile)
        run: |
          pnpm config set registry https://registry.npmmirror.com
          # 删除旧的 lockfile 让 pnpm 重新生成，彻底解决不一致问题
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile

      - name: Build frontend library
        working-directory: easytier-web/frontend-lib
        run: pnpm build

      - name: Verify frontend build output
        run: |
          echo "=== 检查前端构建产物 ==="
          ls -la easytier-web/frontend-lib/dist/ 2>/dev/null || echo "⚠️ dist 目录不存在"
          echo "=== 检查关键关键词 ==="
          grep -r "advanced_settings\|port_forwards\|clipboard_sync" \
            easytier-web/frontend-lib/dist/ 2>/dev/null | head -5 || echo "⚠️ 未找到关键关键词"

      # ─── 安装 Tauri CLI ───
      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2" --locked 2>/dev/null || true

      # ─── 添加 swap 防止 OOM ───
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile 2>/dev/null || true
          sudo chmod 600 /swapfile 2>/dev/null || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h

      # ─── 构建 Android APK ───
      - name: Build Android APK
        working-directory: easytier-gui
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            cargo tauri android build --release
          else
            cargo tauri android build --apk
          fi

      # ─── 查找并上传 APK ───
      - name: Find APK
        id: find_apk
        run: |
          APK=$(find easytier-gui/gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 未找到 APK 文件"
            echo "=== 输出目录内容 ==="
            find easytier-gui/gen/android/app/build/ -type f 2>/dev/null | head -30
            exit 1
          fi
          echo "✅ 找到 APK: $APK"
          cp "$APK" /tmp/easytier-transfer.apk
          ls -lh /tmp/easytier-transfer.apk
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-transfer-android-${{ github.event.inputs.build_type || 'debug' }}
          path: /tmp/easytier-transfer.apk
          retention-days: 30

      # ─── 构建摘要 ───
      - name: Build Summary
        if: always()
        run: |
          echo "## 📱 EasyTier Transfer Android" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **包名**: com.easyshare.easytier" >> $GITHUB_STEP_SUMMARY
          echo "- **版本**: v2.6.4" >> $GITHUB_STEP_SUMMARY
          echo "- **构建类型**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **时间**: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/easytier-transfer.apk ]; then
            echo "- **APK**: ✅ $(du -h /tmp/easytier-transfer.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **APK**: ❌ 未生成" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 排查提示" >> $GITHUB_STEP_SUMMARY
          echo "- 如果 UI 选项缺失，检查 'Verify frontend build output' 步骤" >> $GITHUB_STEP_SUMMARY
          echo "- 如果 OOM，检查 swap 空间是否生效" >> $GITHUB_STEP_SUMMARY
          echo "- 如果 sdkmanager 找不到，检查 'Setup Android SDK' 步骤" >> $GITHUB_STEP_SUMMARY
          echo "- 查看 Actions 日志获取详细错误信息" >> $GITHUB_STEP_SUMMARY
