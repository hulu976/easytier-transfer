name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 对齐 Cargo.toml 中的 tauri = "2.7.0"
  TURI_CLI_VERSION: "2.7.0"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Rust 工具链 ───
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./easytier-gui/src-tauri
          key: android-2.7.0-${{ hashFiles('**/Cargo.lock') }}

      # ─── JDK ───
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ─── Android SDK + NDK ───
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & NDK
        run: |
          sdkmanager --install "platforms;android-33" "platform-tools" "ndk;25.2.9519653" "build-tools;33.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ─── Node + pnpm ───
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configure pnpm mirror
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm config set @tauri-apps:registry https://registry.npmmirror.com

      # ─── 安装前端依赖（不冻结 lockfile）───
      - name: Install frontend dependencies
        working-directory: ./easytier-gui
        run: |
          # 删除旧 lockfile，让 pnpm 基于当前 package.json 重新解析
          rm -f pnpm-lock.yaml
          pnpm install --no-frozen-lockfile

      # ─── 对齐 Tauri CLI 到 2.7.0（与 Cargo.toml 的 tauri crate 一致）───
      - name: Install Tauri CLI v${{ env.TURI_CLI_VERSION }}
        run: |
          cargo install tauri-cli --version ${{ env.TURI_CLI_VERSION }} --locked --force
          cargo tauri info

      # ─── 验证前端构建产物 ───
      - name: Verify frontend build
        working-directory: ./easytier-gui
        run: |
          pnpm --filter easytier-web build
          test -d "src-tauri/gen/apple" || echo "iOS assets not generated (expected on Linux)"
          ls -la src-tauri/

      # ─── 添加 swap 防止 OOM ───
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ─── 构建 APK ───
      - name: Build Android APK
        working-directory: ./easytier-gui/src-tauri
        run: |
          cargo tauri android build --apk --target aarch64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      # ─── 查找并上传 APK ───
      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find ./easytier-gui/src-tauri/gen/android -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found"
            find ./easytier-gui/src-tauri/gen -type f -name "*" | head -50
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easytier-transfer-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # ─── 构建摘要 ───
      - name: Build summary
        if: always()
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Tauri crate: 2.7.0 (locked in Cargo.toml)" >> $GITHUB_STEP_SUMMARY
          echo "- Tauri CLI: ${{ env.TURI_CLI_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rust: 1.95" >> $GITHUB_STEP_SUMMARY
          echo "- NDK: 25.2.9519653" >> $GITHUB_STEP_SUMMARY
          echo "- Target: aarch64-linux-android" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.find_apk.outputs.apk_path }}" ]; then
            echo "- APK: ${{ steps.find_apk.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY
          fi
